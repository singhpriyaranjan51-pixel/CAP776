name: Recalculate daily tracker

on:
  push:
    paths:
      - '12609311*.xlsx'
      - 'main.py'
      - 'calculation.py'
      - 'requirements.txt'
      - '.github/workflows/calculate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Calculate daily tracker results
        run: python main.py